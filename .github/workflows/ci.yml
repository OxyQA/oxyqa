name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pinned pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  # Self-hosted packaging: the image must build and migrate an empty Postgres.
  self-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build migrate
      - run: docker compose run --rm migrate
      - name: Schema is present
        run: |
          tables=$(docker compose exec -T postgres psql -U oxyqa -d oxyqa -Atc "select count(*) from information_schema.tables where table_schema='public'")
          echo "public tables: $tables"
          test "$tables" -ge 6
      - name: Services load their code in the image
        run: docker compose run --rm --no-deps worker node --import tsx -e "await import('./apps/worker/src/plans.ts'); await import('./apps/webhook/src/app.ts'); console.log('ok')"
      - if: always()
        run: docker compose down -v
